  <style>

  <script>
const reasons = [
  "You make masculinity feel soft, safe, and comforting instead of loud or intimidating 🤍",
  "You always open your arms for me before anything else, and somehow that hug makes the whole day feel lighter 🤭",
  "You’re calm in a way that makes everything feel steady, funny without even trying, and protective in a way that makes me feel safe without needing to ask 🤍",
  "You make even future thoughts feel exciting and funny... Fun fact: when we’re married and people use our initials, it’ll be M. Dubazane 😂🤍.",
  "I always feel safe around you—like at Loftus when you were enjoying everything that was happening, but still didn’t move your focus from me and stayed behind me holding me close the whole time 🥺🤍",
  "The way you carry your values with quiet discipline, like praying before you eat, makes me admire you more than I probably say 😂🤍.",
  "The way you understand my humor and sarcasm without me needing to explain anything makes it so easy being around you 🤍",
  "Your soft smile and your laugh make even normal moments feel warm ",
  "Our long conversations that go on for hours, and the conspiracy theories we end up on, stay in my mind even when I’m not next to you 🤍.",
  "You’re naturally smart in a way that I find really attractive 🤍",
  "You making us breakfast in the morning when you wake up is one of the sweetest ways you show you care 😌🤍",
  "Your appreciation for the small things is something that could honestly make me emotional if I wrote about it properly 🤍",
  "You always show up. Whether it’s changing your plans, making time, or simply being there when I need you, I’ve never had to question that 🤍",
  "Because no matter how confidently I sing, you’ll always find a way to humble me 😂.",
  "Your eyes have a habit of saying things your mouth never does 👀🤍",
  "I could probably make a whole list of things that make me laugh about you, and somehow I’d still miss a few 😂🤍",
  "Our conversations always leave me with something new to think about, learn, or research, and that’s something I never want to lose 🤍",
  "You make me want to be better—not because you ask me to, but because every Scrabble game leaves me a little stronger than the last...Fun fact: I still haven’t won a single match, but my score keeps getting better. At this point, I’m calling it character development😂 ",
  "You match my character so well, it just feels right 🤍",
  "The first time we had a misunderstanding, the way you handled it made me realize how safe communication with you feels 🤍",
  "You always look out for me in the smallest ways—checking if I’m okay when I’m coming to see you, making sure I’ve eaten, and never letting me lift anything heavy 🤍",
  "As a firstborn who’s used to always being strong for everyone, you let me be soft and bring out a feminine side of me I don’t always show 🤍",
  "Even in moments of intimate closeness, you make me feel safe, grounded, and completely at ease. I never feel anxious or like I need to overthink anything—I just feel respected and secure with you 🤍",
  "Your long conversations with me make me drop my barriers and wear my heart on my sleeve, and that always makes me feel closer to you 🤍",
  "The way you always stick to your word and stay consistent with what you say makes me trust you more over time 🤍",
  "The moment you see me you always come for a hug and a kiss first, and you also never fail to call me ‘stranger’ every time—it’s become one of your cutest habits 🤍",
  "You never make me feel dismissed when I share ideas—you either explore them with me or calmly share your perspective 🤍",
  "The way you stay calm in disagreements, listen to me properly, and always try to find common ground really shows how you think 🤍",
  "You have this funny way of teasing me without directly dismissing what I say, and it always makes me laugh 🤍",
  "You have a good taste, I mean you have me as a Girlfriend🤍... You know ball👌🤭",
  "Your need for structure and order has helped me grow in how I see myself and understand my own boundaries, and I’m grateful for that 🤍",
  "You get a bit annoyed when I’m late, but you still check if I’m on my way and always make sure there’s a way for me to get to you—even sorting out someone to fetch me when needed 🤍",
  "Even after weeks of not talking, being around you still feels familiar—like nothing has changed 🤍",
  "You give me emotional security because distance, silence, or misunderstandings never make me question where I stand with you 🤍",
  "You don’t rush the relationship or overperform to speed things up, and even in conflict you stay calm and careful with your words, which gives me hope for us long-term 🤍",
  "People do live up to their names, and with you it feels especially true. Mhlengi means “the Saviour,” and in your own way, you’ve carried that meaning without even trying. You’ve shown up like protection when things felt uncertain, like help when things felt heavy, and like light when everything felt a bit too dark. Not loudly, not for attention, just quietly and consistently in the way that actually matters."
];

let currentPage = 1;

const defaultConfig = {
  main_title: "36 Reasons Why I Love You",
  password_text: "iloveyou",
  video_url: "https://www.youtube.com/watch?v=nWwA6R5S1PM",
  background_color: "#0a0e14",
  surface_color: "#151d2a",
  text_color: "#e2e8f0",
  primary_color: "#a8b8c8",
  secondary_color: "#d9e1e8",
  font_family: "Playfair Display",
  font_size: 16
};

// Particles
function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'absolute rounded-full';
    p.style.cssText = `
      width: ${Math.random() * 4 + 2}px;
      height: ${Math.random() * 4 + 2}px;
      background: rgba(212, 175, 55, ${Math.random() * 0.3 + 0.1});
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      animation: float ${Math.random() * 4 + 3}s ease-in-out infinite;
      animation-delay: ${Math.random() * 2}s;
    `;
    container.appendChild(p);
  }
}
createParticles();

// Password form
document.getElementById('pw-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const val = document.getElementById('pw-input').value;
  const pw = window.elementSdk?.config?.password_text || defaultConfig.password_text;
  if (val === pw) {
    document.getElementById('password-screen').classList.add('hidden');
    document.getElementById('pages-container').classList.remove('hidden');
    showPage(0);
  } else {
    document.getElementById('pw-error').classList.remove('hidden');
  }
});

function updateSunMoon(idx) {
  const sun = document.getElementById('page-sun');
  const moon = document.getElementById('page-moon');
  
  // Alternate sun/moon based on page index
  if (idx % 2 === 0) {
    sun.style.display = 'block';
    moon.style.display = 'none';
  } else {
    sun.style.display = 'none';
    moon.style.display = 'block';
  }
}

function showPage(idx) {
  currentPage = idx;
  const content = document.getElementById('page-content');
  const pageCard = document.getElementById('page-card');
  const reasonText = document.getElementById('reason-text');
  
  // Remove animation classes
  content.classList.remove('slide-in');
  reasonText.classList.remove('text-animate');
  pageCard.classList.remove('final-page');
  
  // Trigger reflow to restart animation
  void content.offsetWidth;
  
  // Add animation classes back
  content.classList.add('slide-in');
  reasonText.classList.add('text-animate');
  
  // Update sun/moon
  updateSunMoon(idx);
  
  // Page number (1-38)
  document.getElementById('page-num').textContent = `${idx + 1} / 38`;
  
  const videoLink = document.getElementById('video-link');
  
  // Page 0: Video
  if (idx === 0) {
    reasonText.textContent = 'Watch something special for you...';
    const videoUrl = window.elementSdk?.config?.video_url || defaultConfig.video_url;
    videoLink.href = videoUrl;
    videoLink.classList.remove('hidden');
  } 
  // Page 37: Final message
  else if (idx === 37) {
    reasonText.textContent = 'Take care stranger i love you';
    videoLink.classList.add('hidden');
    pageCard.classList.add('final-page');
  }
  // Pages 1-36: Reasons
  else {
    reasonText.textContent = reasons[idx - 1];
    videoLink.classList.add('hidden');
  }
  
  document.getElementById('prev-btn').disabled = idx === 0;
  document.getElementById('next-btn').textContent = idx === 37 ? '💕 Fin' : 'Next →';
}

document.getElementById('prev-btn').addEventListener('click', () => { 
  if (currentPage > 0) showPage(currentPage - 1); 
});

document.getElementById('next-btn').addEventListener('click', () => { 
  if (currentPage < 37) showPage(currentPage + 1); 
});

// Element SDK
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    const title = config.main_title || defaultConfig.main_title;
    const font = config.font_family || defaultConfig.font_family;
    const size = config.font_size || defaultConfig.font_size;
    const bg = config.background_color || defaultConfig.background_color;
    const surface = config.surface_color || defaultConfig.surface_color;
    const textCol = config.text_color || defaultConfig.text_color;
    const primary = config.primary_color || defaultConfig.primary_color;
    const secondary = config.secondary_color || defaultConfig.secondary_color;

    document.getElementById('main-title').textContent = title;
    document.body.style.background = `linear-gradient(135deg, ${bg}, ${surface}, ${bg})`;
    document.getElementById('reason-text').style.fontFamily = `${font}, serif`;
    document.getElementById('reason-text').style.fontSize = `${size * 1.4}px`;
    document.getElementById('main-title').style.fontFamily = `${font}, serif`;

    document.querySelectorAll('.page-card').forEach(el => {
      el.style.background = `linear-gradient(145deg, ${surface}, ${bg})`;
      el.style.borderColor = `${primary}44`;
    });
    document.querySelectorAll('.reason-box').forEach(el => {
      el.style.borderColor = `${primary}66`;
    });
    document.getElementById('reason-text').style.color = textCol;
    document.querySelectorAll('.steel-btn').forEach(el => {
      el.style.background = `linear-gradient(135deg, ${primary}, ${secondary}, ${primary})`;
    });
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
      { get: () => config.secondary_color || defaultConfig.secondary_color, set: (v) => { config.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); } }
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
  }),
  mapToEditPanelValues: (config) => new Map([
    ["main_title", config.main_title || defaultConfig.main_title],
    ["password_text", config.password_text || defaultConfig.password_text],
    ["video_url", config.video_url || defaultConfig.video_url]
  ])
});
